<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" role="img" aria-labelledby="title desc">
<title id="title">합성 데이터 v1·v2에서 규칙 기준선, gpt-6.1-terra, gpt-6.1-sol의 라벨 정확도와 결론 재현율</title>
<desc id="desc">v1(고른 표기)에서는 셋 다 90% 이상이다. v2(다양한 표기)에서 규칙 기준선은 라벨 13/55, 재현율 6/25로 떨어지고 terra는 55/55, 25/25(3회 실행 모두 같음), sol은 54/55(보류 1), 24/24다.</desc>
<rect width="900" height="400" rx="12" fill="#fcfcfb"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#0b0b0b">표기를 다양하게 바꾸면 규칙은 무너지고 LLM 에이전트는 그대로</text>
<text x="28" y="64" font-size="13" fill="#52514e">합성 데이터(시드 7). 정답은 생성기가 정한다. terra v2는 같은 설정 3회 실행이 모두 같은 점수, sol은 판단 보류 1건(hard-01)</text>
