[project]
name = "studio-grader"
version = "0.1.0"
description = "savetax-lab 2부 채점기(채점 명세 studio/docs/scoring.md). 답안지·근거 발급 기록·정답 파일을 읽기만 한다"
requires-python = ">=3.12"
dependencies = [
    "studio-schema",
]

[tool.uv.sources]
studio-schema = { path = "../schema", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_grader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
