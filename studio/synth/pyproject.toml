[project]
name = "studio-synth"
version = "0.1.0"
description = "savetax-lab 2부 데모용 합성 데이터 생성기(조달 물품·판매처 페이지·정답 라벨)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
