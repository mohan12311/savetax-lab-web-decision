[project]
name = "studio-review"
version = "0.1.0"
description = "savetax-lab 2부 웹 검토 화면의 백엔드(표준 라이브러리 HTTP, 루프백 전용). 답안지를 내주고 사람 판정을 받는다"
requires-python = ">=3.12"
dependencies = [
    "studio-schema",
    "studio-sheet",
]

[tool.uv.sources]
studio-schema = { path = "../schema", editable = true }
studio-sheet = { path = "../sheet", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
