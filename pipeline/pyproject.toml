[project]
name = "savetax-pipeline"
version = "0.1.0"
description = "savetax-lab 정제·집계 파이프라인 (bronze → silver → gold)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytz>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savetax_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
