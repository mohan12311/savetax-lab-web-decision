[project]
name = "studio-schema"
version = "0.1.0"
description = "savetax-lab 2부 답안지 JSON Schema의 Python 로더(불러오기·검증·금액 파싱). 판단 로직은 넣지 않는다"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
